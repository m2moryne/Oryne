name: contracts

# Builds and tests the Soroban contracts on Linux, then publishes the wasm
# (and the test log, pass or fail) to the rolling "contracts-latest" release
# so the backend and local tooling can download them without a Rust toolchain.

on:
  push:
    branches: [master]
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32v1-none

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin stellar
          stellar --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ../ci-log.txt

      - name: Build wasm
        id: build
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          stellar contract build 2>&1 | tee -a ../ci-log.txt
          cp target/wasm32v1-none/release/agent_wallet.wasm ../agent_wallet.wasm
          sha256sum ../agent_wallet.wasm | tee ../agent_wallet.wasm.sha256

      - name: Publish to the contracts-latest release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "commit ${GITHUB_SHA}" >> ci-log.txt
          echo "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}" >> ci-log.txt
          gh release view contracts-latest >/dev/null 2>&1 || \
            gh release create contracts-latest --prerelease --title "Contracts (latest build)" \
              --notes "Rolling build of contracts/ from master. Not audited."
          files="ci-log.txt"
          [ -f agent_wallet.wasm ] && files="$files agent_wallet.wasm agent_wallet.wasm.sha256"
          gh release upload contracts-latest $files --clobber

      - name: Fail if tests or build failed
        if: steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
