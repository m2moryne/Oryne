<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The home page's tags. scripts/seo.ts writes a copy per public page with its own
         title, description and URL (from src/lib/seo.ts); usePageMeta updates them in the app. -->
    <title>Oryne — AI agent wallets with limits they can’t break</title>
    <meta
      name="description"
      content="Give your AI agent a wallet it can spend from, with a budget, a cap per payment and approved services enforced by a smart contract on Stellar. Not a promise: code."
    />
    <link rel="canonical" href="https://oryne.org/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#202020" />

    <!-- Open Graph -->
    <meta property="og:image" content="https://oryne.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oryne" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oryne" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Oryne — AI agent wallets with limits they can’t break" />
    <meta
      property="og:description"
      content="Give your AI agent a wallet it can spend from, with a budget, a cap per payment and approved services enforced by a smart contract on Stellar. Not a promise: code."
    />
    <meta property="og:url" content="https://oryne.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@oryneorg" />
    <meta name="twitter:image" content="https://oryne.org/og-image.png" />
    <meta name="twitter:title" content="Oryne — AI agent wallets with limits they can’t break" />
    <meta
      name="twitter:description"
      content="Give your AI agent a wallet it can spend from, with a budget, a cap per payment and approved services enforced by a smart contract on Stellar. Not a promise: code."
    />

    <!-- Who Oryne is, for search engines. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://oryne.org/#organization",
            "name": "Oryne",
            "url": "https://oryne.org/",
            "logo": "https://oryne.org/brand/oryne-mark.svg",
            "email": "info@oryne.org",
            "sameAs": ["https://x.com/oryneorg"],
            "description": "The mandate layer for AI agent payments on Stellar."
          },
          {
            "@type": "WebSite",
            "@id": "https://oryne.org/#website",
            "name": "Oryne",
            "url": "https://oryne.org/",
            "publisher": { "@id": "https://oryne.org/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Oryne",
            "url": "https://oryne.org/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "description": "Wallets for AI agents with spending limits enforced by a Soroban smart contract on Stellar: budgets, per-payment caps, allowed services, expiry and ask-first approvals.",
            "publisher": { "@id": "https://oryne.org/#organization" }
          }
        ]
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The loader shown before the app starts; React replaces it. Same design as .loader in index.css. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .boot .loader { position: relative; display: block; transform: rotateZ(45deg); perspective: 1000px; border-radius: 50%; width: 48px; height: 48px; color: #0576fe; }
      .boot .loader::before, .boot .loader::after { content: ''; display: block; position: absolute; top: 0; left: 0; width: inherit; height: inherit; border-radius: 50%; transform: rotateX(70deg); animation: 1s boot-orbit linear infinite; }
      .boot .loader::after { color: #fc771f; transform: rotateY(70deg); animation-delay: 0.4s; }
      @keyframes boot-orbit {
        0%, 100% { box-shadow: 0.2em 0 0 0 currentcolor; } 12% { box-shadow: 0.2em 0.2em 0 0 currentcolor; }
        25% { box-shadow: 0 0.2em 0 0 currentcolor; } 37% { box-shadow: -0.2em 0.2em 0 0 currentcolor; }
        50% { box-shadow: -0.2em 0 0 0 currentcolor; } 62% { box-shadow: -0.2em -0.2em 0 0 currentcolor; }
        75% { box-shadow: 0 -0.2em 0 0 currentcolor; } 87% { box-shadow: 0.2em -0.2em 0 0 currentcolor; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span class="loader"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
