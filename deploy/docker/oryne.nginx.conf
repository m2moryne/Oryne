# The server's nginx in front of the Docker containers. See deploy/docker/README.md.
#   sudo cp deploy/docker/oryne.nginx.conf /etc/nginx/conf.d/oryne.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d testnet-apiv1.oryne.org -d apiv1.oryne.org -d demo.oryne.org
# certbot adds the HTTPS (443) parts and the http → https redirects to this file.
#
# Only these server_names are touched; the server's other sites keep their own files.
#
# The website (container `web`, 127.0.0.1:8790) isn't here yet: oryne.org stays
# on Vercel until its DNS moves. Then add a block for it like the ones below
# (proxy_pass http://127.0.0.1:8790) and run certbot with -d oryne.org -d www.oryne.org.

upstream oryne_api_mainnet { server 127.0.0.1:8789; keepalive 16; }
upstream oryne_api_testnet { server 127.0.0.1:8787; keepalive 16; }
upstream oryne_demo_merchant { server 127.0.0.1:8788; keepalive 8; }

# X-Forwarded-For is set to the real client address, never appended to: the
# API rate-limits sign-in codes by its first entry, which a client could
# otherwise fake.

server {
    listen 80;
    server_name apiv1.oryne.org;
    client_max_body_size 2m;

    location / {
        proxy_pass http://oryne_api_mainnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settling a payment waits for the Stellar ledger.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    server_name testnet-apiv1.oryne.org;
    client_max_body_size 2m;

    location / {
        proxy_pass http://oryne_api_testnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    server_name demo.oryne.org;

    location / {
        proxy_pass http://oryne_demo_merchant;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
