# nginx inside the `web` container: serves the built website. HTTPS is the
# server's own nginx, in front (deploy/docker/oryne.nginx.conf).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pre-rendered pages (/docs → docs/index.html), then the single-page app.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
