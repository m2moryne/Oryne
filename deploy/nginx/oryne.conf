# nginx for Oryne. See deploy/README.md.
#   sudo cp deploy/nginx/oryne.conf /etc/nginx/sites-available/oryne.conf
#   sudo ln -s /etc/nginx/sites-available/oryne.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d oryne.org -d www.oryne.org -d api.oryne.org -d testnet-api.oryne.org -d demo.oryne.org
# certbot adds the HTTPS (443) blocks and the http → https redirects itself.
#
# Only these server_names are touched; Ardena's sites keep their own files.

upstream oryne_api_mainnet { server 127.0.0.1:8789; keepalive 16; }
upstream oryne_api_testnet { server 127.0.0.1:8787; keepalive 16; }
upstream oryne_demo_merchant { server 127.0.0.1:8788; keepalive 8; }

# ---------------------------------------------------------------- website

server {
    listen 80;
    listen [::]:80;
    server_name www.oryne.org;
    return 301 https://oryne.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name oryne.org;

    # deploy.sh copies each finished build here, so a build never serves half-written files.
    root /var/www/oryne;
    index index.html;

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pre-rendered pages (/docs → docs/index.html), then the single-page app.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ---------------------------------------------------------------- APIs

# Shared proxy settings, repeated per API so each block reads on its own.
# X-Forwarded-For is set to the real client address, never appended to: the
# API rate-limits sign-in codes by its first entry, which a client could
# otherwise fake.

server {
    listen 80;
    listen [::]:80;
    server_name api.oryne.org;
    client_max_body_size 2m;

    location / {
        proxy_pass http://oryne_api_mainnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settling a payment waits for the Stellar ledger.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name testnet-api.oryne.org;
    client_max_body_size 2m;

    location / {
        proxy_pass http://oryne_api_testnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# ---------------------------------------------------------------- demo merchant (testnet)

server {
    listen 80;
    listen [::]:80;
    server_name demo.oryne.org;

    location / {
        proxy_pass http://oryne_demo_merchant;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
