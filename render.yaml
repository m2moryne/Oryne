# Render Blueprint: the Oryne API on Stellar testnet.
# Render → New → Blueprint → pick this repo. Fill in the "sync: false" values when asked.
services:
  - type: web
    name: oryne-api
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    buildCommand: npm ci
    startCommand: npm start -w @oryne/api
    healthCheckPath: /v1/info
    # Only redeploy for changes the API depends on.
    buildFilter:
      paths:
        - services/api/**
        - packages/core/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ORYNE_NETWORK
        value: testnet
      - key: DEV_LOGIN
        value: "1"
      # Where the dashboard runs, e.g. http://localhost:5173 while testing.
      - key: WEB_URL
        sync: false
      # Comma-separated browser origins, usually the same as WEB_URL.
      - key: CORS_ORIGINS
        sync: false
      # Supabase (or any Postgres): Connect → Session pooler connection string, with
      # the password filled in. Keeps accounts, wallets and sessions across restarts.
      - key: DATABASE_URL
        sync: false
      # The free plan's disk is wiped on every deploy and restart. Pin the testnet
      # keys so the same sponsor and test USDC come back (npm run keys -w @oryne/api).
      - key: SPONSOR_SECRET
        sync: false
      - key: TOKEN_ISSUER_SECRET
        sync: false
      # Turns on the admin API for the admin site (apps/admin): 32+ random characters.
      - key: ADMIN_TOKEN
        sync: false
      # The admin site's address, e.g. https://adminweb.oryne.org; always allowed by CORS.
      - key: ADMIN_URL
        sync: false
      # "Continue with email": sign-in codes sent with Resend (resend.com).
      # EMAIL_FROM must be on a domain verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Oryne <noreply@oryne.org>
      # Card top-ups with Paystack. Webhook URL in the Paystack dashboard:
      # https://<this service>/v1/paystack/webhook
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Currency cards are charged in, and how much one USDC costs in it.
      - key: PAYSTACK_CURRENCY
        value: KES
      - key: PAYSTACK_RATE
        value: "130"
      # DeepSeek API key (platform.deepseek.com) for the AI debugger in the developer console.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # The demo merchant: a small paid API the example agents buy from
  # (examples/research-agent). Testnet only. MERCHANT_ADDRESS is a public
  # testnet address with a trustline to the API's test USDC; no secret needed.
  - type: web
    name: oryne-demo-merchant
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    buildCommand: npm ci
    startCommand: npm start -w @oryne/demo-merchant
    healthCheckPath: /
    buildFilter:
      paths:
        - examples/demo-merchant/**
        - packages/merchant/**
        - packages/core/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MERCHANT_ADDRESS
        value: GBVW7MH67HCBJVQGO3M6SKI7X5SPTINFDYFIIP4FUXU23OME4LIYWBQW
      - key: FACILITATOR_URL
        value: https://oryne.onrender.com/v1/x402
